name: Browser environment measurement

# Opt-in diagnostics, independent of the existing required CI checks. A label lets
# the initial implementation be measured before this workflow reaches main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-measurement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Measure warm browser environment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'ci-measure-warm') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci-measure-warm'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: dotnet build src/Doctheca.sln --configuration Release
      - name: Admin frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test
      - name: Prewarm this isolated runner
        run: python3 scripts/ci-test-environment.py prepare
      - name: Measure warm setup
        run: python3 scripts/ci-test-environment.py prepare
      - name: Verify test environment failures
        run: |
          python3 scripts/ci-test-environment.py probe
          python3 scripts/test-ci-test-environment.py --linux
      - name: Full unit and browser tests
        run: python3 scripts/ci-test-environment.py test
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build original image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: doctheca:ci
          build-args: |
            NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          cache-from: type=gha,scope=doctheca-release
      - name: Container startup and failure exit
        run: python3 scripts/verify-container-startup.py doctheca:ci
      - name: Upload measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-environment-warm-measurement
          path: reports/
          if-no-files-found: ignore
